[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "Python-DataEngine"
authors = [{name = "tlibs313"}]
dynamic = ["version", "description", "readme"]
dependencies = [
    "dnspython>=2.6.1",
    "greenlet>=3.0.3",
    "numpy>=1.26.4",
    "pandas>=2.2.1,<3.0.0",
    "psycopg2>=2.9.9,<3.0.0",
    "pymongo>=4.6.2,<5.0.0",
    "pymssql>=2.2.11,<3.0.0",
    "pyodbc>=5.1.0,<6.0.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
    "six>=1.16.0",
    "SQLAlchemy>=2.0.29,<3.0.0",
    "typing_extensions>=4.10.0",
    "tzdata>=2024.1"
]

[tool.flit.module]
name = "DataEngine"

[project.urls]
Home = "https://github.com/SqlDataSpire/DataEngine"
